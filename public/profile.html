<!DOCTYPE html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BETTERVISION OS · 손님 이력</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/bv-toss.css">
<style>
.look{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.look .fld{flex:1;min-width:220px}
.look label{display:block;font-size:15px;color:var(--muted);margin-bottom:4px}
.look input,.look select{font-size:17px;width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}
.pc .sub2{font-size:15px;color:var(--muted);margin-top:4px}
.res{margin-top:10px}
.res .row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:17px;cursor:pointer}
.res .row:hover{color:var(--ink)}
.res .row .m{color:var(--muted);font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1.4fr;gap:14px;margin-top:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.pc{border:1px solid var(--line);border-radius:12px;padding:18px;background:#fff}
.ttl{font-size:15px;color:var(--muted);margin:0 0 10px}
.nm{font-size:26px;font-weight:400;color:var(--ink)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line2);font-size:17px}
.kv .k{color:var(--muted);font-size:15px}
.ev{display:grid;grid-template-columns:100px 96px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2);font-size:17px}
.ev .d{color:var(--muted);font-size:15px}
.ev .k{font-size:15px;color:var(--ink)}
.ev .s{color:var(--muted);font-size:15px}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.flt button{font-size:15px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
.flt button.on{border-color:var(--ink);color:var(--ink)}
.cs{font-size:15px;line-height:1.6;color:var(--body)}
.cs label{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:17px}
.cs input{margin-top:5px}
.btn{font-size:15px;border-radius:8px;padding:9px 14px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:#fff;color:var(--ink)}
.note{font-size:15px;color:var(--muted)}
.warn{color:#8a5a00}
.empty{color:var(--muted);padding:24px 0;font-size:17px}
</style></head><body>
<script>fetch('/api/me').then(function(r){return r.json();}).then(function(j){if(j&&j.authOn&&!j.user){var pg=location.pathname.split('/').pop()||'index.html';location.href='login.html?next='+encodeURIComponent(pg);}}).catch(function(){});</script>
<div class="topbar"><div class="topbar-in"><div class="brand"><span class="mark">BETTER<b>VISION</b><sup>™</sup></span><span class="tag" style="background:none;color:inherit;font-weight:inherit;padding:0">OS</span></div>
<div class="nav-links">
    <a href="index.html">홈</a>
    <a href="a.html">사업 개요</a>
    <span class="nav-div" aria-hidden="true"></span>
    <a href="customer.html">손님 앱</a>
    <span class="nav-dd"><a href="store.html">가맹점</a><span class="nav-menu"><a href="store.html">매장 홈</a><a href="flow.html">1 접객</a><a href="exam.html">2 검안</a><a href="workorder.html">3 테 판정 · 가공</a><a href="fit.html">4 피팅</a></span></span>
    <a href="hq.html">본사</a>
  </div></div></div>
<div class="wrap"><section class="view active">
<div class="lead"><div><div class="eyebrow">손님 이력</div><h2>손님 한 명의 기록을 한 화면에</h2>
<div class="sub">측정 · 검안 · 가공 · 피팅 · 견적 · 구매 · 7일째 확인 · A/S · 연락. 기록은 본부 DB 하나에 쌓임</div></div></div>

<div class="card pad">
  <div class="look">
    <div class="fld"><label>이름 또는 전화 끝 4자리</label><input id="q" placeholder="예: 윤서진 / 0001" oninput="search()"></div>
    <button class="btn ghost" onclick="showNew()">새 손님 등록</button>
  </div>
  <div id="res" class="res"></div>
  <div id="newBox" style="display:none;margin-top:14px"></div>
</div>

<div id="out"></div>
</section></div>
<div class="foot"><span>BETTERVISION OS · 손님 이력 v1.0</span><span>ST-CRM-01 · ST-CRM-02 · CM-PRV-01</span></div>
<script>
var CUSTS=[], CT=null, FILTER='전체';
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function load(){ return fetch('/api/customers').then(function(r){return r.json();}).then(function(j){ CUSTS=j.customers||[]; }); }
function search(){
  var q=document.getElementById('q').value.trim(), box=document.getElementById('res');
  if(!q){ box.innerHTML=''; return; }
  var hit=CUSTS.filter(function(c){ return String(c.name||'').indexOf(q)>=0 || String(c.phone||'').replace(/\D/g,'').slice(-4)===q.replace(/\D/g,''); }).slice(0,8);
  box.innerHTML = hit.length ? hit.map(function(c){ return '<div class="row" onclick="open1('+c.id+')"><span>'+esc(c.name)+'</span><span class="m">'+esc(c.phone||'')+' · '+esc(c.store||'')+' · '+esc(c.size||'-')+'</span></div>'; }).join('')
    : '<div class="empty">찾는 손님 없음. 새 손님이면 "새 손님 등록"</div>';
}
function showNew(){
  var b=document.getElementById('newBox'); b.style.display='block';
  fetch('/api/consent').then(function(r){return r.json();}).then(function(j){
    b.innerHTML='<div class="look"><div class="fld"><label>이름</label><input id="nName"></div><div class="fld"><label>전화</label><input id="nPhone" type="tel" placeholder="010-0000-0000"></div>'+(window.BV_STORE?'':'<div class="fld"><label>매장</label><select id="nStore"><option>성수점</option><option>홍대점</option><option>판교점</option></select></div>')+'</div>'+
      '<div class="cs" style="margin-top:10px"><label><input type="checkbox" id="nReq"> '+esc(j.text.required)+'</label><label><input type="checkbox" id="nMkt"> '+esc(j.text.marketing)+'</label>'+
      '<div class="note">동의 문구 '+esc(j.version)+' · 법률 검토 뒤 확정</div></div>'+
      '<div style="margin-top:10px"><button class="btn" onclick="addNew()">등록</button> <span id="nMsg" class="note"></span></div>';
  });
}
function addNew(){
  var name=document.getElementById('nName').value.trim(), phone=document.getElementById('nPhone').value.trim(), req=document.getElementById('nReq').checked, mkt=document.getElementById('nMkt').checked, msg=document.getElementById('nMsg');
  if(!name){ msg.textContent='이름 필요'; return; }
  if(!req){ msg.innerHTML='<span class="warn">필수 동의 없이는 기록을 남길 수 없음. 손님께 설명 후 체크</span>'; return; }
  var dup=CUSTS.filter(function(c){ return phone && String(c.phone||'').replace(/\D/g,'')===phone.replace(/\D/g,''); })[0];
  if(dup){ msg.innerHTML='<span class="warn">같은 전화번호 손님 있음: '+esc(dup.name)+' ('+esc(dup.store||'')+')</span>'; return; }
  fetch('/api/customers',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name,phone:phone,store:(window.BV_STORE||(document.getElementById('nStore')||{}).value||'')})}).then(function(r){return r.json();}).then(function(j){
    if(!j.ok){ msg.textContent=j.error||'등록 실패'; return; }
    return fetch('/api/consent',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({customer_id:j.id,required:true,marketing:mkt,source:'매장 등록'})}).then(function(){ return load(); }).then(function(){ document.getElementById('newBox').style.display='none'; open1(j.id); });
  });
}
function open1(id){
  history.replaceState(null,'','?id='+id);
  fetch('/api/customer/timeline?id='+id).then(function(r){return r.json();}).then(function(j){
    if(!j.ok){ document.getElementById('out').innerHTML='<div class="card pad empty">'+esc(j.error||'불러오지 못함')+'</div>'; return; }
    CT=j; render();
  });
}
function consentHtml(){
  var c=CT.consent;
  var st = !c ? '<span class="warn">동의 기록 없음</span>' : (c.required?'필수 동의':'<span class="warn">필수 미동의</span>')+' · 알림 수신 '+(c.marketing?'동의':'안 함');
  return '<div class="kv"><span class="k">상태</span><span>'+st+'</span></div>'+
    (c?'<div class="note" style="margin-top:6px">'+esc(String(c.created_at||'').slice(0,10))+' · '+esc(c.source||'')+' · 문구 '+esc(c.version||'')+'</div>':'')+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">'+
    (!c||!c.required?'<button class="btn" onclick="setC(true,'+(c&&c.marketing?'true':'false')+')">필수 동의 받음</button>':'')+
    (c&&c.required&&!c.marketing?'<button class="btn ghost" onclick="setC(true,true)">알림 수신 동의 받음</button>':'')+
    (c&&c.marketing?'<button class="btn ghost" onclick="setC(true,false)">알림 수신 철회</button>':'')+'</div>';
}
function setC(req,mkt){ fetch('/api/consent',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({customer_id:CT.customer.id,required:req,marketing:mkt,source:mkt||!CT.consent?'매장':'철회'})}).then(function(){ open1(CT.customer.id); }); }
function render(){
  var c=CT.customer, kinds=['전체'].concat(CT.events.map(function(e){return e.kind;}).filter(function(k,i,a){return a.indexOf(k)===i;}));
  var ev=CT.events.filter(function(e){return FILTER==='전체'||e.kind===FILTER;});
  var vis=CT.vision.length?CT.vision.map(function(v){ return '<div class="kv"><span class="k">'+esc(v.member==='본인'?'':v.member+' · ')+esc(v.grp)+'</span><span>'+(v.due?'<span class="warn">검사일 지남 '+esc(v.next)+'</span>':'다음 검사 '+esc(v.next))+'</span></div>'; }).join(''):'<div class="note">검안 기록 없음</div>';
  document.getElementById('out').innerHTML='<div class="grid2"><div>'+
    '<div class="pc"><div class="nm">'+esc(c.name)+'</div><div class="sub2">'+esc(c.phone||'')+' · '+esc(c.store||'')+'</div>'+
      '<div style="margin-top:12px"><div class="kv"><span class="k">9사이즈</span><span>'+esc(c.size||'-')+'</span></div><div class="kv"><span class="k">PD</span><span>'+esc(c.pd||'-')+'</span></div><div class="kv"><span class="k">최근 처방</span><span>'+esc(c.rx||'-')+'</span></div><div class="kv"><span class="k">포인트</span><span>'+Number(c.points||0).toLocaleString('ko-KR')+'</span></div></div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:14px"><a class="btn" href="measure.html">측정</a><a class="btn ghost" href="exam.html">검안</a><a class="btn ghost" href="quote.html?customer='+c.id+'">견적</a><a class="btn ghost" href="fit.html">피팅</a></div></div>'+
    '<div class="pc" style="margin-top:14px"><div class="ttl">검사 시기</div>'+vis+'</div>'+
    '<div class="pc" style="margin-top:14px"><div class="ttl">개인정보 동의</div>'+consentHtml()+'</div>'+
  '</div><div class="pc"><div class="ttl">기록 '+CT.events.length+'건 (최근 순)</div>'+
    '<div class="flt">'+kinds.map(function(k){return '<button class="'+(k===FILTER?'on':'')+'" onclick="FILTER=\''+k+'\';render()">'+esc(k)+'</button>';}).join('')+'</div>'+
    (ev.length?ev.map(function(e){ return '<div class="ev"><span class="d">'+esc(String(e.at).slice(0,10))+'</span><span class="k">'+esc(e.kind)+'</span><span>'+esc(e.text)+(e.store?' <span class="s">· '+esc(e.store)+'</span>':'')+'</span></div>'; }).join(''):'<div class="empty">기록 없음</div>')+
  '</div></div>';
}
fetch('/api/me').then(function(r){return r.json();}).then(function(j){ if(j&&j.user&&j.user.store) window.BV_STORE=j.user.store; }).catch(function(){});
load().then(function(){ var id=new URLSearchParams(location.search).get('id'); if(id) open1(id); });
</script>
<script src="/assets/bv-nav.js"></script>
</body></html>
